# Prod edge (Blue/Green static) — serves the SPA and proxies the Java API.
# Implements docs/deploy.md routing law (same rules as deploy/caddy/Caddyfile).
#
# Blue/Green: the upstream LB (api_upstream) and the swap of the static root
# are the deployment mechanics. To cut over, build the new release into the
# other directory and flip the symlink (or edit `root` below):
#
#   /var/www/spa-blue  <- current release (symlink target)
#   /var/www/spa-green <- next release
#   root /var/www/spa;   # symlink -> spa-blue | spa-green
#
# This snippet assumes:
#   upstream api_upstream { server 127.0.0.1:8080; }  # defined in the main nginx.conf

# --- Rule 1: API prefix -> Java ------------------------------------
location = /api {
	proxy_pass http://api_upstream;
}
location ^~ /api/ {
	proxy_pass http://api_upstream;
}

# --- Rule 2: actuator prefix -> Java -------------------------------
location = /actuator {
	proxy_pass http://api_upstream;
}
location ^~ /actuator/ {
	proxy_pass http://api_upstream;
}

# --- Rule 4 (reserved SPA paths first: exact/^~ win over the regex) -
# Reserved single-segment paths MUST stay in sync with src/App.tsx:
# /login, /register, /links. Multi-segment /links/:id is handled by
# location ^~ /links/.
location = /login {
	try_files /index.html =404;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header X-DNS-Prefetch-Control "off" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
location = /register {
	try_files /index.html =404;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header X-DNS-Prefetch-Control "off" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
location = /links {
	try_files /index.html =404;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header X-DNS-Prefetch-Control "off" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
location ^~ /links/ {
	try_files /index.html =404;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header X-DNS-Prefetch-Control "off" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}

# --- Rule 3: short codes -> Java (302 redirect; never index.html) --
# Single segment of the short-code alphabet [A-Za-z0-9_-]{1,64}.
# Reserved paths are excluded above via exact/^~ locations, which take
# precedence over this regex in NGINX's evaluation order.
location ~ ^/[A-Za-z0-9_-]{1,64}$ {
	proxy_pass http://api_upstream;
}

# --- Rules 4-5: SPA (static assets + index.html fallback) ----------
root /var/www/spa;
location / {
	try_files $uri $uri/ /index.html;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header X-DNS-Prefetch-Control "off" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
	# HSTS — enable ONLY in the TLS server block that includes this snippet
	# (same values as the Java API: 1y includeSubDomains preload).
	# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
}