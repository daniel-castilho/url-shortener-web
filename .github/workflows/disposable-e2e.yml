name: Disposable Backend E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disposable-e2e.yml'
      - 'e2e/**'

jobs:
  disposable-backend:
    name: Disposable Backend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v5

      - name: Checkout backend (url-shortener-service)
        uses: actions/checkout@v5
        with:
          repository: daniel-castilho/url-shortener-service
          token: ${{ secrets.GITHUB_TOKEN }}
          path: backend

      - name: Start disposable backend
        working-directory: ./backend
        env:
          APP_ADMIN_EMAILS: admin@example.com
          RATE_LIMITER_LIMIT: 100000
          RATE_LIMITER_AUTH_LIMIT: 100000
        run: |
          # Create docker-compose override to fix logback permissions
          cat > docker-compose.override.yml << 'EOF'
          services:
            app:
              user: "root"
              volumes:
                - ./logs:/app/logs
              command: ["sh", "-c", "mkdir -p /app/logs && chmod 777 /app/logs && java -jar app.jar"]
          EOF
          
          docker compose -f docker-compose.e2e.yaml -f docker-compose.override.yml up --build -d
          
          # Wait for backend to be healthy - use the correct liveness endpoint
          echo "Waiting for backend to be healthy..."
          HEALTHY=false
          
          for i in {1..60}; do
            echo "Attempt $i/60: Checking backend health..."
            
            # Approach 1: Host port 8080 - use liveness endpoint (matches docker-compose healthcheck)
            if curl -sf http://localhost:8080/actuator/health/liveness >/dev/null 2>&1; then
              echo "Backend healthy on localhost:8080/actuator/health/liveness"
              echo "BACKEND_URL=http://localhost:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 2: Host port 8080 - standard health endpoint
            if curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "Backend healthy on localhost:8080/actuator/health"
              echo "BACKEND_URL=http://localhost:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 3: Host port 8081 (common management port)
            if curl -sf http://localhost:8081/actuator/health >/dev/null 2>&1; then
              echo "Backend healthy on localhost:8081"
              echo "BACKEND_URL=http://localhost:8081" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 4: Docker network - try service name with liveness
            if docker run --rm --network backend_url-shortener-e2e-net curlimages/curl:latest -sf http://urlshortener-e2e-app:8080/actuator/health/liveness >/dev/null 2>&1; then
              echo "Backend healthy on container network (urlshortener-e2e-app:8080/actuator/health/liveness)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 5: Try service name on port 8080 standard health
            if docker run --rm --network backend_url-shortener-e2e-net curlimages/curl:latest -sf http://urlshortener-e2e-app:8080/actuator/health >/dev/null 2>&1; then
              echo "Backend healthy on container network (urlshortener-e2e-app:8080/actuator/health)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 6: Try from within the app container itself
            if docker exec urlshortener-e2e-app curl -sf http://localhost:8080/actuator/health/liveness >/dev/null 2>&1; then
              echo "Backend healthy from inside app container (localhost:8080/actuator/health/liveness)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            if docker exec urlshortener-e2e-app curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "Backend healthy from inside app container (localhost:8080/actuator/health)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            echo "  Backend not ready yet, waiting 5s... (attempt $i/60)"
            sleep 5
          done
          
          if [ "$HEALTHY" != "true" ]; then
            echo "Backend health check failed after 60 attempts"
            echo "Debugging info:"
            echo "--- Docker containers ---"
            docker ps
            echo "--- Container logs (app) ---"
            docker logs urlshortener-e2e-app --tail 100
            echo "--- Docker networks ---"
            docker network ls
            echo "--- Docker network inspect ---"
            docker network inspect backend_url-shortener-e2e-net
            exit 1
          fi
          
          echo "Backend is healthy at $BACKEND_URL"
          
          # Copy and run fixed seed script
          cp ../scripts/seed-e2e-fixed.sh .
          chmod +x seed-e2e-fixed.sh
          bash seed-e2e-fixed.sh

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Start frontend preview server with API proxy
        run: |
          # Create vite config with proxy for preview
          cat > vite.config.preview.ts << 'EOF'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'
          
          export default defineConfig({
            plugins: [react()],
            server: {
              proxy: {
                '/api': {
                  target: 'http://localhost:8080',
                  changeOrigin: true,
                  rewrite: (path) => path.replace(/^\/api/, '/api'),
                },
              },
            },
            preview: {
              port: 5173,
              host: '0.0.0.0',
              proxy: {
                '/api': {
                  target: 'http://localhost:8080',
                  changeOrigin: true,
                  rewrite: (path) => path.replace(/^\/api/, '/api'),
                },
              },
            },
          })
          EOF
          
          npx vite preview --config vite.config.preview.ts --host 0.0.0.0 --port 5173 &
          echo "FRONTEND_URL=http://localhost:5173" >> $GITHUB_ENV
          
          # Wait for frontend to be ready
          for i in {1..30}; do
            if curl -sf http://localhost:5173 >/dev/null 2>&1; then
              echo "Frontend ready at http://localhost:5173"
              break
            fi
            sleep 2
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Admin Probe (14.25)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          VITE_API_BASE_URL: http://localhost:8080
          E2E_EMAIL: admin@example.com
          E2E_PASSWORD: password123
        run: npx playwright test e2e/admin-probe.spec.ts

      - name: Run Bearer E2E (14.23)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          VITE_API_BASE_URL: http://localhost:8080
        run: npx playwright test e2e/bearer-journey.spec.ts

      - name: Run Cookie E2E (14.24)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          VITE_API_BASE_URL: http://localhost:8080
          VITE_AUTH_MODE: cookie
        run: npx playwright test e2e/cookie-session.spec.ts

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-e2e-traces
          path: test-results/
          retention-days: 7
