name: Disposable Backend E2E

on:
  workflow_dispatch:

jobs:
  disposable-backend:
    name: Disposable Backend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v5

      - name: Checkout backend (url-shortener-service)
        uses: actions/checkout@v5
        with:
          repository: daniel-castilho/url-shortener-service
          token: ${{ secrets.GITHUB_TOKEN }}
          path: backend

      - name: Start disposable backend
        working-directory: ./backend
        env:
          APP_ADMIN_EMAILS: admin@example.com
          RATE_LIMITER_LIMIT: 100000
          RATE_LIMITER_AUTH_LIMIT: 100000
        run: |
          cat > docker-compose.override.yml << 'EOF'
          services:
            app:
              user: "root"
              volumes:
                - ./logs:/app/logs
              command: ["sh", "-c", "mkdir -p /app/logs && chmod 777 /app/logs && java -jar app.jar"]
          EOF
          
          docker compose -f docker-compose.e2e.yaml -f docker-compose.override.yml up --build -d
          
          echo "Waiting for backend to be healthy..."
          HEALTHY=false
          
          for i in {1..60}; do
            echo "Attempt $i/60: Checking backend health..."
            
            if curl -sf http://localhost:8080/actuator/health/liveness >/dev/null 2>&1; then
              echo "Backend healthy on localhost:8080/actuator/health/liveness"
              echo "BACKEND_URL=http://localhost:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            if curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "Backend healthy on localhost:8080/actuctor/health"
              echo "BACKEND_URL=http://localhost:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            if curl -sf http://localhost:8081/actuator/health >/dev/null 2>&1; then
              echo "Backend healthy on localhost:8081"
              echo "BACKEND_URL=http://localhost:8081" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            if docker run --rm --network backend_url-shortener-e2e-net curlimages/curl:latest -sf http://urlshortener-e2e-app:8080/actuator/health/liveness >/dev/null 2>&1; then
              echo "Backend healthy on container network (urlshortener-e2e-app:8080/actuator/health/liveness)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            if docker run --rm --network backend_url-shortener-e2e-net curlimages/curl:latest -sf http://urlshortener-e2e-app:8080/actuator/health >/dev/null 2>&1; then
              echo "Backend healthy on container network (urlshortener-e2e-app:8080/actuator/health)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            if docker exec urlshortener-e2e-app curl -sf http://localhost:8080/actuator/health/liveness >/dev/null 2>&1; then
              echo "Backend healthy from inside app container (localhost:8080/actuator/health/liveness)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            if docker exec urlshortener-e2e-app curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "Backend healthy from inside app container (localhost:8080/actuctor/health)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            echo "  Backend not ready yet, waiting 5s... (attempt $i/60)"
            sleep 5
          done
          
          if [ "$HEALTHY" != "true" ]; then
            echo "Backend health check failed after 60 attempts"
            echo "--- Docker containers ---"
            docker ps
            echo "--- Container logs (app) ---"
            docker logs urlshortener-e2e-app --tail 100
            echo "--- Docker networks ---"
            docker network ls
            echo "--- Docker network inspect ---"
            docker network inspect backend_url-shortener-e2e-net
            exit 1
          fi
          
          echo "Backend is healthy at $BACKEND_URL"
          cp ../scripts/seed-e2e-fixed.sh .
          chmod +x seed-e2e-fixed.sh
          bash seed-e2e-fixed.sh

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run API-level E2E tests (14.23, 14.24)
        env:
          API_BASE_URL: ${{ env.BACKEND_URL }}
          E2E_EMAIL: admin@example.com
          E2E_PASSWORD: password123
        run: |
          set -euo pipefail
          
          # Create Python validator using printf to avoid heredoc issues
          printf 'import json, sys\nwith open(sys.argv[1]) as f:\n    payload = json.load(f)\nfor field in sys.argv[2:]:\n    if not payload.get(field):\n        print("FAIL: missing required field %s in response" %% field)\n        sys.exit(1)\nprint("OK: all required fields present (%%s)" %% ", ".join(sys.argv[2:]))\n' > /tmp/validate_json.py
          
          validate_json() {
            python3 /tmp/validate_json.py "$@"
          }
          
          echo "=== Testing bearer auth flow ==="
          
          # POST /api/v1/auth/login -> 200, token
          body=$(mktemp)
          trap 'rm -f "$body"' RETURN
          status=$(curl -sS -o "$body" -w '%{http_code}' -X POST "${API_BASE_URL}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@example.com","password":"password123"}')
          if [[ "$status" != "200" ]]; then
            echo "FAIL: login expected HTTP 200; got $status"
            exit 1
          fi
          validate_json "$body" token
          TOKEN=$(cat "$body" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          
          # POST /api/v1/urls -> 200, id, shortUrl
          body=$(mktemp)
          trap 'rm -f "$body"' RETURN
          status=$(curl -sS -o "$body" -w '%{http_code}' -X POST "${API_BASE_URL}/api/v1/urls" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"originalUrl":"https://api-e2e.example.com/test","customAlias":"api-e2e-test"}')
          if [[ "$status" != "200" ]]; then
            echo "FAIL: shorten expected HTTP 200; got $status"
            exit 1
          fi
          validate_json "$body" id shortUrl
          echo "Bearer shorten: OK"
          
          # GET /api/v1/urls -> 200, items
          body=$(mktemp)
          trap 'rm -f "$body"' RETURN
          status=$(curl -sS -o "$body" -w '%{http_code}' -X GET "${API_BASE_URL}/api/v1/urls" \
            -H "Authorization: Bearer $TOKEN")
          if [[ "$status" != "200" ]]; then
            echo "FAIL: list expected HTTP 200; got $status"
            exit 1
          fi
          validate_json "$body" items
          echo "Bearer list: OK"
          
          echo "=== Testing cookie flow ==="
          
          COOKIE_JAR=$(mktemp)
          trap 'rm -f "$COOKIE_JAR"' RETURN
          
          # POST /api/v1/auth/login (cookie) -> 200, cookies set
          body=$(mktemp)
          trap 'rm -f "$body"' RETURN
          status=$(curl -sS -o "$body" -w '%{http_code}' -X POST "${API_BASE_URL}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@example.com","password":"password123"}' \
            -c "$COOKIE_JAR" -b "$COOKIE_JAR")
          if [[ "$status" != "200" ]]; then
            echo "FAIL: cookie login expected HTTP 200; got $status"
            exit 1
          fi
          if ! grep -q "access_token" "$COOKIE_JAR" || ! grep -q "refresh_token" "$COOKIE_JAR"; then
            echo "FAIL: cookies not set in cookie jar"
            cat "$COOKIE_JAR"
            exit 1
          fi
          echo "Cookie login: OK (access_token + refresh_token cookies set)"
          
          # POST /api/v1/urls (cookie) -> 200, id
          body=$(mktemp)
          trap 'rm -f "$body"' RETURN
          status=$(curl -sS -o "$body" -w '%{http_code}' -X POST "${API_BASE_URL}/api/v1/urls" \
            -H "Content-Type: application/json" \
            -d '{"originalUrl":"https://cookie-e2e.example.com/test"}' \
            -b "$COOKIE_JAR")
          if [[ "$status" != "200" ]]; then
            echo "FAIL: cookie shorten expected HTTP 200; got $status"
            exit 1
          fi
          validate_json "$body" id
          echo "Cookie shorten: OK"
          
          # POST /api/v1/auth/refresh (cookie) -> 200, token, refreshToken
          body=$(mktemp)
          trap 'rm -f "$body"' RETURN
          status=$(curl -sS -o "$body" -w '%{http_code}' -X POST "${API_BASE_URL}/api/v1/auth/refresh" \
            -b "$COOKIE_JAR")
          if [[ "$status" != "200" ]]; then
            echo "FAIL: refresh expected HTTP 200; got $status"
            exit 1
          fi
          validate_json "$body" token refreshToken
          TOKEN=$(cat "$body" | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])"')
          echo "Cookie refresh: OK"
          
          echo "=== All API E2E tests passed ==="

      - name: Run Admin Probe (14.25) - API only
        env:
          API_BASE_URL: ${{ env.BACKEND_URL }}
          E2E_EMAIL: admin@example.com
          E2E_PASSWORD: password123
        run: |
          set -euo pipefail
          
          TOKEN=$(curl -sS -X POST "${API_BASE_URL}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@example.com","password":"password123"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          
          USERS_RESP=$(curl -sf -H "Authorization: Bearer $TOKEN" "${API_BASE_URL}/api/v1/admin/users?limit=5")
          USER_COUNT=$(echo "$USERS_RESP" | python3 -c 'import sys,json;data=json.load(sys.stdin);print(len(data["items"]))')
          echo "Users: $USER_COUNT"
          if [ "$USER_COUNT" -lt 2 ]; then
            echo "ERROR: Expected at least 2 users"
            exit 1
          fi
          
          curl -sf -H "Authorization: Bearer $TOKEN" "${API_BASE_URL}/api/v1/admin/users/demo-user-id/urls" | python3 -c 'import sys,json;data=json.load(sys.stdin);print("User URLs:", len(data["items"]))' || true
          
          LOOKUP_RESP=$(curl -sf -H "Authorization: Bearer $TOKEN" "${API_BASE_URL}/api/v1/admin/urls?code=api-e2e-test")
          HAS_ITEM=$(echo "$LOOKUP_RESP" | python3 -c 'import sys,json;data=json.load(sys.stdin);print("item" in data)')
          if [ "$HAS_ITEM" != "True" ]; then
            echo "ERROR: URL lookup failed"
            exit 1
          fi
          echo "URL lookup works"
          
          echo "Admin probe API tests passed!"

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-e2e-traces
          path: test-results/
          retention-days: 7
