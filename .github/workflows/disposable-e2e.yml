## Force re-index
name: Disposable Backend E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disposable-e2e.yml'
      - 'e2e/**'

jobs:
  disposable-backend:
    name: Disposable Backend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v5

      - name: Checkout backend (url-shortener-service)
        uses: actions/checkout@v5
        with:
          repository: daniel-castilho/url-shortener-service
          token: ${{ secrets.GITHUB_TOKEN }}
          path: backend

      - name: Start disposable backend
        working-directory: ./backend
        env:
          APP_ADMIN_EMAILS: admin@example.com
          RATE_LIMITER_LIMIT: 100000
          RATE_LIMITER_AUTH_LIMIT: 100000
        run: |
          # Create docker-compose override to fix logback permissions
          cat > docker-compose.override.yml << 'EOF'
          services:
            app:
              user: "root"
              volumes:
                - ./logs:/app/logs
              command: ["sh", "-c", "mkdir -p /app/logs && chmod 777 /app/logs && java -jar app.jar"]
          EOF
          
          docker compose -f docker-compose.e2e.yaml -f docker-compose.override.yml up --build -d
          
          # Wait for backend to be healthy - use the correct liveness endpoint
          echo "Waiting for backend to be healthy..."
          HEALTHY=false
          
          for i in {1..60}; do
            echo "Attempt $i/60: Checking backend health..."
            
            # Approach 1: Host port 8080 - use liveness endpoint (matches docker-compose healthcheck)
            if curl -sf http://localhost:8080/actuator/health/liveness >/dev/null 2>&1; then
              echo "✓ Backend healthy on localhost:8080/actuator/health/liveness"
              echo "BACKEND_URL=http://localhost:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 2: Host port 8080 - standard health endpoint
            if curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "✓ Backend healthy on localhost:8080/actuator/health"
              echo "BACKEND_URL=http://localhost:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 3: Host port 8081 (common management port)
            if curl -sf http://localhost:8081/actuator/health >/dev/null 2>&1; then
              echo "✓ Backend healthy on localhost:8081"
              echo "BACKEND_URL=http://localhost:8081" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 4: Docker network - try service name with liveness
            if docker run --rm --network backend_url-shortener-e2e-net curlimages/curl:latest -sf http://urlshortener-e2e-app:8080/actuator/health/liveness >/dev/null 2>&1; then
              echo "✓ Backend healthy on container network (urlshortener-e2e-app:8080/actuator/health/liveness)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 5: Try service name on port 8080 standard health
            if docker run --rm --network backend_url-shortener-e2e-net curlimages/curl:latest -sf http://urlshortener-e2e-app:8080/actuator/health >/dev/null 2>&1; then
              echo "✓ Backend healthy on container network (urlshortener-e2e-app:8080/actuator/health)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 6: Try from within the app container itself
            if docker exec urlshortener-e2e-app curl -sf http://localhost:8080/actuator/health/liveness >/dev/null 2>&1; then
              echo "✓ Backend healthy from inside app container (localhost:8080/actuator/health/liveness)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            if docker exec urlshortener-e2e-app curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "✓ Backend healthy from inside app container (localhost:8080/actuator/health)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            echo "  Backend not ready yet, waiting 5s... (attempt $i/60)"
            sleep 5
          done
          
          if [ "$HEALTHY" != "true" ]; then
            echo "❌ Backend health check failed after 60 attempts"
            echo "Debugging info:"
            echo "--- Docker containers ---"
            docker ps
            echo "--- Container logs (app) ---"
            docker logs urlshortener-e2e-app --tail 100
            echo "--- Docker networks ---"
            docker network ls
            echo "--- Docker network inspect ---"
            docker network inspect backend_url-shortener-e2e-net
            exit 1
          fi
          
          echo "Backend is healthy at $BACKEND_URL"
          
          # Seed data - use fixed seed script with longer aliases (min 8 chars for FREE plan)
          cat > seed-e2e-fixed.sh << 'EOF'
#!/bin/bash
set -euo pipefail
API_BASE="${API_BASE:-http://localhost:8080}"
DEMO_PASSWORD="${DEMO_PASSWORD:-password123}"

USER_EMAIL="demo@example.com"
ADMIN_EMAIL="${APP_ADMIN_EMAILS:-}"

say() { printf '\n\033[1;34m==> %s\033[0m\n' "$*"; }
ok() { printf '\033[0;32m    %s\033[0m\n' "$*"; }

register() { 
  local name="$1" email="$2"
  local resp code
  resp="$(
    curl -sS -o /tmp/seed-body.json -w '%{http_code}' \
     -H 'Content-Type: application/json' \
     -d "{\"name\":\"$name\",\"email\":\"$email\",\"password\":\"$DEMO_PASSWORD\"}" \
     "$API_BASE/api/v1/auth/register" || true
  )"
  code="${resp}"
  if [ "$code" = "200" ]; then
    ok "registered $email"
    python3 -c 'import json;print(json.load(open("/tmp/seed-body.json"))["token"])'
  elif [ "$code" = "400" ] && grep -q "EMAIL_IN_USE\|already" /tmp/seed-body.json 2>/dev/null; then
    ok "$email already registered (reusing)"
    code=$(curl -sS -o /tmp/seed-body.json -w '%{http_code}' \
      -H 'Content-Type: application/json' \
      -d "{\"email\":\"$email\",\"password\":\"$DEMO_PASSWORD\"}" \
      "$API_BASE/api/v1/auth/login") || true
    if [ "$code" = "200" ]; then
      python3 -c 'import json;print(json.load(open("/tmp/seed-body.json"))["token"])'
    else
      echo "ERROR: login for $email failed (HTTP $code)" >&2
      exit 1
    fi
  else
    echo "ERROR: seeding $email failed (HTTP $code): $(cat /tmp/seed-body.json 2>/dev/null || true)" >&2
    exit 1
  fi
}

shorten() {
  local alias="$1" url="$2" ttl="${3:-}" token="$4"
  local body="{\"originalUrl\":\"$url\",\"customAlias\":\"$alias\""
  [ -n "$ttl" ] && body="$body,\"ttlSeconds\":$ttl"
  body="$body}"
  local code
  code=$(curl -sS -o /tmp/seed-body.json -w '%{http_code}' \
    -H 'Content-Type: application/json' \
    -H "Authorization: Bearer $token" \
    -d "$body" \
    "$API_BASE/api/v1/urls" || true)
  if [ "$code" = "200" ]; then
    ok "$(python3 -c 'import json;print(json.load(open("/tmp/seed-body.json"))["shortUrl"])' 2>/dev/null || echo "$alias") 2>/dev/null || true
  elif [ "$code" = "409" ]; then
    ok "$alias already exists (skipped)"
  else
    echo "ERROR: shortening $alias failed (HTTP $code): $(cat /tmp/seed-body.json 2>/dev/null || true)" >&2
    exit 1
  fi
}

main() {
  say() { printf '\n\033[1;34m==> %s\033[0m\n' "$*"; }
  ok() { printf '\033[0;32m    %s\033[0m\n' "$*"; }

  curl -fsS "$API_BASE/actuator/health/liveness" >/dev/null \
    || { echo "ERROR: backend not reachable at $API_BASE" >&2; exit 1; }

  say "Seeding demo user"
  USER_TOKEN="$(register "E2E Demo User" "demo@example.com")"

  if [ -n "$ADMIN_EMAIL" ]; then
    say "Seeding admin user ($ADMIN_EMAIL)"
    ADMIN_TOKEN="$(register "E2E Admin" "$ADMIN_EMAIL")"
  fi

  say "Seeding sample links (demo user) - using aliases >= 8 chars for FREE plan"
  # Use aliases >= 8 chars for FREE plan minimum
  shorten "docs-page"   "https://example.com/documentation"   ""    "$USER_TOKEN"
  shorten "blog-launch" "https://example.com/blog/launch"     ""    "$USER_TOKEN"
  shorten "limited-time" "https://example.com/limited-time"   36000 "$USER_TOKEN"

  say "Seed complete."
  ok "demo user:   demo@example.com / password123"
  [ -n "$ADMIN_EMAIL" ] && ok "admin user:  $ADMIN_EMAIL / password123"
  ok "sample links: /docs-page /blog-launch /limited-time"
}

main "$@"
EOF
          chmod +x seed-e2e-fixed.sh
          bash seed-e2e-fixed.sh

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Admin Probe (14.25)
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.BACKEND_URL }}
          E2E_EMAIL: admin@example.com
          E2E_PASSWORD: password123
        run: npx playwright test e2e/admin-probe.spec.ts

      - name: Run Bearer E2E (14.23)
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.BACKEND_URL }}
        run: npx playwright test e2e/bearer-journey.spec.ts

      - name: Run Cookie E2E (14.24)
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.BACKEND_URL }}
          VITE_AUTH_MODE: cookie
        run: npx playwright test e2e/cookie-session.spec.ts

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-e2e-traces
          path: test-results/
          retention-days: 7
