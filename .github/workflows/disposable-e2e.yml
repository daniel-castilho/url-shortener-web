name: Disposable Backend E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disposable-e2e.yml'
      - 'e2e/**'

jobs:
  disposable-backend:
    name: Disposable Backend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v5

      - name: Checkout backend (url-shortener-service)
        uses: actions/checkout@v5
        with:
          repository: daniel-castilho/url-shortener-service
          token: ${{ secrets.GITHUB_TOKEN }}
          path: backend

      - name: Start disposable backend
        working-directory: ./backend
        env:
          APP_ADMIN_EMAILS: admin@example.com
          RATE_LIMITER_LIMIT: 100000
          RATE_LIMITER_AUTH_LIMIT: 100000
        run: |
          # Create docker-compose override to ensure logs directory exists
          cat > docker-compose.override.yml << 'EOF'
          services:
            app:
              volumes:
                - ./logs:/app/logs
              command: ["sh", "-c", "mkdir -p /app/logs && java -jar app.jar"]
          EOF
          
          docker compose -f docker-compose.e2e.yaml -f docker-compose.override.yml up --build -d
          
          # Wait for backend to be healthy - try multiple approaches
          echo "Waiting for backend to be healthy..."
          HEALTHY=false
          
          for i in {1..60}; do
            echo "Attempt $i/60: Checking backend health..."
            
            # Approach 1: Host port 8080
            if curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "✓ Backend healthy on localhost:8080"
              echo "BACKEND_URL=http://localhost:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 2: Host port 8081 (common management port)
            if curl -sf http://localhost:8081/actuator/health >/dev/null 2>&1; then
              echo "✓ Backend healthy on localhost:8081"
              echo "BACKEND_URL=http://localhost:8081" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 3: Host port 9090 (another common management port)
            if curl -sf http://localhost:9090/actuator/health >/dev/null 2>&1; then
              echo "✓ Backend healthy on localhost:9090"
              echo "BACKEND_URL=http://localhost:9090" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 4: Docker network - try service name
            if docker run --rm --network backend_url-shortener-e2e-net curlimages/curl:latest -sf http://urlshortener-e2e-app:8080/actuator/health >/dev/null 2>&1; then
              echo "✓ Backend healthy on container network (urlshortener-e2e-app:8080)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 5: Try service name on port 8081 in container network
            if docker run --rm --network backend_url-shortener-e2e-net curlimages/curl:latest -sf http://urlshortener-e2e-app:8081/actuator/health >/dev/null 2>&1; then
              echo "✓ Backend healthy on container network (urlshortener-e2e-app:8081)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8081" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            # Approach 6: Try from within the app container itself
            if docker exec urlshortener-e2e-app curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1; then
              echo "✓ Backend healthy from inside app container (localhost:8080)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8080" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            if docker exec urlshortener-e2e-app curl -sf http://localhost:8081/actuator/health >/dev/null 2>&1; then
              echo "✓ Backend healthy from inside app container (localhost:8081)"
              echo "BACKEND_URL=http://urlshortener-e2e-app:8081" >> $GITHUB_ENV
              HEALTHY=true
              break
            fi
            
            echo "  Backend not ready yet, waiting 5s... (attempt $i/60)"
            sleep 5
          done
          
          if [ "$HEALTHY" != "true" ]; then
            echo "❌ Backend health check failed after 60 attempts"
            echo "Debugging info:"
            echo "--- Docker containers ---"
            docker ps
            echo "--- Container logs (app) ---"
            docker logs urlshortener-e2e-app --tail 50
            echo "--- Docker networks ---"
            docker network ls
            echo "--- Docker network inspect ---"
            docker network inspect backend_url-shortener-e2e-net
            exit 1
          fi
          
          echo "Backend is healthy at $BACKEND_URL"
          
          # Seed data
          bash scripts/seed-e2e.sh

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Admin Probe (14.25)
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.BACKEND_URL }}
          E2E_EMAIL: admin@example.com
          E2E_PASSWORD: password123
        run: npx playwright test e2e/admin-probe.spec.ts

      - name: Run Bearer E2E (14.23)
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.BACKEND_URL }}
        run: npx playwright test e2e/bearer-journey.spec.ts

      - name: Run Cookie E2E (14.24)
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.BACKEND_URL }}
          VITE_AUTH_MODE: cookie
        run: npx playwright test e2e/cookie-session.spec.ts

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-e2e-traces
          path: test-results/
          retention-days: 7
